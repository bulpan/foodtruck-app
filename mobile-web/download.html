<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>푸드트럭 앱 다운로드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4d9de0);
        }

        .logo {
            width: 120px;
            height: 120px;
            background: transparent;
            border-radius: 25px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            padding: 8px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .device-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #ffd700;
        }

        .device-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .device-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .device-desc {
            font-size: 14px;
            color: #666;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }


        .features {
            text-align: left;
            margin-top: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4d9de0, #6bcf7f);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }

        .feature-text {
            flex: 1;
        }

        .feature-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }

        .feature-desc {
            font-size: 14px;
            color: #666;
        }

        .loading {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .manual-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .manual-links h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .manual-link {
            display: inline-block;
            margin: 5px 10px;
            padding: 8px 16px;
            background: #f8f9fa;
            color: #666;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .manual-link:hover {
            background: #e9ecef;
            color: #333;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .download-btn {
                padding: 15px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/images/app-icon.png" alt="유미네곱창트럭 앱 아이콘" style="width: 100%; height: 100%; object-fit: contain; border-radius: 20px;">
        </div>
        <h1>유미네곱창트럭 앱</h1>
        <p class="subtitle">맛있는 음식을 더 가깝게, 더 편리하게</p>
        
        <div class="device-info">
            <div class="device-icon" id="deviceIcon">📱</div>
            <div class="device-name" id="deviceName">기기 감지 중...</div>
            <div class="device-desc" id="deviceDesc">앱을 다운로드하세요</div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>앱스토어로 이동 중...</p>
        </div>

        <a href="#" class="download-btn" id="downloadBtn" style="display: none;">
            <span id="downloadText">앱 다운로드</span>
        </a>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">📍</div>
                <div class="feature-text">
                    <div class="feature-title">실시간 위치 확인</div>
                    <div class="feature-desc">푸드트럭의 현재 위치를 실시간으로 확인하세요</div>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔔</div>
                <div class="feature-text">
                    <div class="feature-title">푸시 알림</div>
                    <div class="feature-desc">새로운 메뉴와 특별 이벤트를 놓치지 마세요</div>
                </div>
            </div>
        </div>

        <div class="manual-links">
            <h3>직접 다운로드하기</h3>
            <a href="#" class="manual-link" id="iosLink">iOS 앱스토어</a>
            <a href="#" class="manual-link" id="androidLink">Google Play</a>
        </div>
    </div>

    <script>
        // 앱스토어 링크
        const STORE_LINKS = {
            ios: 'https://apps.apple.com/app/id6754273647',
            android: 'https://play.google.com/store/apps/details?id=com.foodtruck.app' // 실제 링크로 교체 필요
        };

        // 디바이스 감지 함수
        function detectDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isIOS = /iphone|ipad|ipod/.test(userAgent);
            const isAndroid = /android/.test(userAgent);
            const isMobile = /mobile/.test(userAgent);

            let deviceInfo = {
                icon: '📱',
                name: '모바일 기기',
                desc: '앱을 다운로드하세요',
                store: null
            };

            if (isIOS) {
                deviceInfo = {
                    icon: '📱',
                    name: 'iPhone/iPad',
                    desc: 'App Store에서 다운로드하세요',
                    store: 'ios'
                };
            } else if (isAndroid) {
                deviceInfo = {
                    icon: '🤖',
                    name: 'Android 기기',
                    desc: 'Google Play에서 다운로드하세요',
                    store: 'android'
                };
            } else if (isMobile) {
                deviceInfo = {
                    icon: '📱',
                    name: '모바일 기기',
                    desc: '앱을 다운로드하세요',
                    store: 'android' // 기본값
                };
            }

            return deviceInfo;
        }

        // UI 업데이트
        function updateUI(deviceInfo) {
            document.getElementById('deviceIcon').textContent = deviceInfo.icon;
            document.getElementById('deviceName').textContent = deviceInfo.name;
            document.getElementById('deviceDesc').textContent = deviceInfo.desc;

            if (deviceInfo.store) {
                const downloadBtn = document.getElementById('downloadBtn');
                const downloadText = document.getElementById('downloadText');
                
                if (deviceInfo.store === 'ios') {
                    downloadText.textContent = 'App Store에서 다운로드';
                } else {
                    downloadText.textContent = 'Google Play에서 다운로드';
                }
                
                downloadBtn.href = STORE_LINKS[deviceInfo.store];
                downloadBtn.style.display = 'inline-block';
            }
        }

        // 수동 링크 설정
        function setupManualLinks() {
            document.getElementById('iosLink').href = STORE_LINKS.ios;
            document.getElementById('androidLink').href = STORE_LINKS.android;
        }

        // 자동 리다이렉트 (선택사항)
        function autoRedirect(deviceInfo) {
            if (deviceInfo.store) {
                // 3초 후 자동 리다이렉트
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('downloadBtn').style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = STORE_LINKS[deviceInfo.store];
                    }, 2000);
                }, 3000);
            }
        }

        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', function() {
            const deviceInfo = detectDevice();
            updateUI(deviceInfo);
            setupManualLinks();
            
            // 자동 리다이렉트는 주석 처리 (필요시 활성화)
            // autoRedirect(deviceInfo);
        });

        // 다운로드 버튼 클릭 이벤트
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const href = this.href;
            
            // 로딩 표시
            document.getElementById('loading').style.display = 'block';
            this.style.display = 'none';
            
            // 1초 후 리다이렉트
            setTimeout(() => {
                window.location.href = href;
            }, 1000);
        });
    </script>
</body>
</html>
